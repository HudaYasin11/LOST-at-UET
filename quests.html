<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Quests - LOST@UET</title>

    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/navigation.css" />
    
    <style>
        .quest-card {
            background: var(--card-bg);
            border-radius: 14px;
            padding: 20px 24px;
            margin-bottom: 16px;
            border: 2px solid var(--border-blue);
            transition: all 0.3s ease;
            position: relative;
        }
        .quest-card:hover { border-color: var(--text-yellow); transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0,0,0,0.15); }
        .quest-card.completed { border-color: #4CAF50; background: rgba(76, 175, 80, 0.06); }
        .quest-card.locked { opacity: 0.6; border-color: #4a4a6a; }
        
        .quest-card .quest-header { display: flex; align-items: center; gap: 14px; margin-bottom: 10px; }
        .quest-card .quest-icon { font-size: 38px; }
        .quest-card .quest-title { font-weight: 700; font-size: 18px; color: var(--text-white); flex: 1; }
        .quest-card .quest-status { font-size: 11px; font-weight: 700; padding: 4px 14px; border-radius: 20px; text-transform: uppercase; letter-spacing: 0.5px; }
        .quest-card .quest-status.locked { background: rgba(149,165,166,0.2); color: var(--text-muted); }
        .quest-card .quest-status.active { background: rgba(247,184,1,0.2); color: var(--text-yellow); }
        .quest-card .quest-status.completed { background: rgba(76,175,80,0.2); color: #4CAF50; }
        
        .quest-card .quest-reward { font-size: 14px; color: var(--text-yellow); font-weight: 600; margin-bottom: 4px; }
        .quest-card .quest-reward.completed-reward { color: #4CAF50; }
        
        .quest-card .clue-box {
            background: var(--dark-bg);
            border-radius: 10px;
            padding: 18px 20px;
            margin: 12px 0;
            min-height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border-blue);
        }
        .quest-card .clue-box .clue-text { font-size: 15px; color: var(--text-white); text-align: center; line-height: 1.7; font-style: italic; }
        .quest-card .clue-box .clue-number { font-size: 12px; color: var(--text-yellow); font-weight: 700; margin-bottom: 6px; display: block; }
        .quest-card .clue-box .locked-clue { color: var(--text-muted); font-size: 14px; }
        
        .quest-card .hint-box { background: rgba(247,184,1,0.08); border: 1px dashed var(--text-yellow); border-radius: 8px; padding: 10px 16px; margin: 10px 0; font-size: 13px; color: var(--text-yellow); }
        
        .quest-card .answer-section { margin: 12px 0; }
        .quest-card .answer-section .answer-row { display: flex; gap: 10px; flex-wrap: wrap; }
        .quest-card .answer-section input {
            flex: 1; padding: 10px 16px; border-radius: 8px; border: 2px solid var(--border-blue);
            background: var(--dark-bg); color: var(--text-white); font-family: var(--font-body); font-size: 14px; min-width: 150px;
        }
        .quest-card .answer-section input:focus { outline: none; border-color: var(--text-yellow); }
        .quest-card .answer-section input::placeholder { color: var(--text-muted); }
        .quest-card .answer-section .btn-submit {
            background: var(--text-yellow); color: var(--dark-bg); border: none; padding: 10px 28px;
            border-radius: 8px; font-weight: 700; font-size: 14px; cursor: pointer; transition: all 0.2s;
        }
        .quest-card .answer-section .btn-submit:hover { transform: scale(1.03); box-shadow: 0 0 20px rgba(247,184,1,0.3); }
        .quest-card .answer-section .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .quest-card .answer-feedback { margin-top: 8px; padding: 10px 14px; border-radius: 8px; font-size: 14px; display: none; }
        .quest-card .answer-feedback.correct { display: block; background: rgba(76,175,80,0.15); border: 1px solid #4CAF50; color: #4CAF50; animation: pulse-green 0.5s ease; }
        .quest-card .answer-feedback.wrong { display: block; background: rgba(255,107,107,0.15); border: 1px solid #FF6B6B; color: #FF6B6B; }
        .quest-card .answer-feedback.info { display: block; background: rgba(72,149,239,0.15); border: 1px solid #4895EF; color: #4895EF; }
        
        @keyframes pulse-green { 0% { transform: scale(1); } 50% { transform: scale(1.02); } 100% { transform: scale(1); } }
        
        .quest-card .completion-message {
            background: rgba(76,175,80,0.08); border: 2px solid #4CAF50; border-radius: 12px;
            padding: 18px 20px; margin: 12px 0; text-align: center;
        }
        .quest-card .completion-message .msg-icon { font-size: 40px; display: block; margin-bottom: 6px; }
        .quest-card .completion-message .msg-text { color: var(--text-white); font-size: 15px; line-height: 1.7; }
        
        .quest-card .quest-progress { display: flex; align-items: center; gap: 12px; margin: 12px 0; flex-wrap: wrap; }
        .quest-card .quest-progress-bar { flex: 1; height: 6px; background: var(--dark-bg); border-radius: 4px; overflow: hidden; min-width: 80px; }
        .quest-card .quest-progress-fill { height: 100%; background: linear-gradient(90deg, var(--text-yellow), #F7B801); border-radius: 4px; transition: width 0.5s ease; }
        .quest-card .quest-progress-fill.completed-fill { background: linear-gradient(90deg, #4CAF50, #66BB6A); }
        .quest-card .quest-progress-text { font-size: 12px; color: var(--text-muted); font-weight: 600; min-width: 40px; }
        
        .quest-card .quest-actions { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
        .quest-card .quest-actions .btn-start { background: var(--text-yellow); color: var(--dark-bg); border: none; padding: 10px 28px; border-radius: 8px; font-weight: 700; font-size: 14px; cursor: pointer; transition: all 0.2s; flex: 1; min-width: 120px; }
        .quest-card .quest-actions .btn-start:hover { transform: scale(1.03); box-shadow: 0 0 20px rgba(247,184,1,0.3); }
        .quest-card .quest-actions .btn-next { background: var(--border-blue); color: white; border: none; padding: 10px 28px; border-radius: 8px; font-weight: 700; font-size: 14px; cursor: pointer; transition: all 0.2s; flex: 1; min-width: 120px; }
        .quest-card .quest-actions .btn-next:hover { background: #5a9fe0; transform: scale(1.03); }
        .quest-card .quest-actions .btn-completed { background: #4CAF50; color: white; border: none; padding: 10px 28px; border-radius: 8px; font-weight: 700; font-size: 14px; cursor: default; opacity: 0.8; flex: 1; min-width: 120px; }

        .step-indicator { display: flex; gap: 8px; justify-content: center; margin: 8px 0; }
        .step-indicator .step-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--dark-bg); border: 2px solid var(--border-blue); transition: all 0.3s; }
        .step-indicator .step-dot.active { background: var(--text-yellow); border-color: var(--text-yellow); box-shadow: 0 0 12px rgba(247,184,1,0.3); }
        .step-indicator .step-dot.completed-dot { background: #4CAF50; border-color: #4CAF50; }

        .clue-counter { font-size: 12px; color: var(--text-muted); text-align: center; margin-top: 4px; }

        .locked-overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 12px; z-index: 2; }
        .locked-overlay .lock-icon { font-size: 40px; margin-bottom: 6px; }
        .locked-overlay .lock-text { font-size: 14px; color: var(--text-muted); }

        .quest-filter { display: flex; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; }
        .quest-filter .filter-btn { padding: 8px 20px; border: 2px solid var(--border-blue); border-radius: 20px; background: transparent; color: var(--text-muted); font-family: var(--font-body); font-weight: 600; font-size: 13px; cursor: pointer; transition: all 0.2s; }
        .quest-filter .filter-btn:hover { border-color: var(--text-yellow); color: var(--text-white); }
        .quest-filter .filter-btn.active { background: var(--text-yellow); color: var(--dark-bg); border-color: var(--text-yellow); }

        .quest-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 18px; }
        .quest-stat { background: var(--card-bg); border-radius: 10px; padding: 14px; text-align: center; border: 1px solid var(--border-blue); }
        .quest-stat .stat-number { font-family: var(--font-pixel); font-size: 22px; color: var(--text-yellow); display: block; }
        .quest-stat .stat-number.completed-num { color: #4CAF50; }
        .quest-stat .stat-label { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
    </style>
    <style>html:not(.auth-ready) body { visibility: hidden; }</style>
    <script type="module" src="js/route-guard.js"></script>
</head>
<body>

    <script type="module">
        import { getCurrentUser } from './js/auth.js';
        import { 
            loadGameData, 
            getState, 
            getTotalXP, 
            getLevel, 
            getTotalDiscoveries, 
            getTotalLocations, 
            refreshUserData,
            refreshQuests,
            getCompletionPercentage,
            subscribe,
            completeQuest
        } from './js/dataService.js';
        import { questsData } from './js/questData.js';

        // ========================================
        // STATE
        // ========================================
        let currentFilter = 'all';
        let allQuests = [];
        const questClueState = {};
        const questAnswerState = {};
        let questClueRenderTrigger = 0;

        // ========================================
        // DOM REFS
        // ========================================
        const questList = document.getElementById('questList');
        const displayName = document.getElementById('userDisplayName');
        const progressBar = document.getElementById('userProgressBar');
        const progressText = document.getElementById('userProgressText');

        // ========================================
        // LOAD DATA
        // ========================================
        async function loadData() {
            try {
                const user = await getCurrentUser();
                if (!user || !user.success) { window.location.href = 'index.html'; return; }

                await loadGameData();
                allQuests = questsData;
                
                allQuests.forEach(q => {
                    const id = String(q.id);
                    if (!questClueState[id]) questClueState[id] = { currentClue: 0, started: false };
                    if (!questAnswerState[id]) questAnswerState[id] = { attempts: 0, locked: false };
                });
                
                updateHeader();
                updateStats();
                renderQuests();
                
            } catch (error) {
                console.error('Error loading data:', error);
                allQuests = questsData;
                renderQuests();
            }
        }

        function updateHeader() {
            const state = getState();
            const user = state.user;
            const discoveries = getTotalDiscoveries();
            const total = getTotalLocations();
            const progress = getCompletionPercentage();

            if (displayName) displayName.textContent = user?.name || user?.username || 'Explorer';
            if (progressBar) progressBar.style.width = progress + '%';
            if (progressText) progressText.textContent = `${discoveries}/${total}`;
        }

        function updateStats() {
            const state = getState();
            const completedQuests = state.user?.completedQuests || [];
            
            const completed = allQuests.filter(q => completedQuests.includes(q.id));
            const active = allQuests.filter(q => !completedQuests.includes(q.id) && (q.is_disclosed || state.user?.discoveries?.length >= 2));

            document.getElementById('questXP').textContent = getTotalXP();
            document.getElementById('questProgress').textContent = completed.length;
            document.getElementById('questTotal').textContent = allQuests.length;
            document.getElementById('activeCount').textContent = active.length;
            document.getElementById('completedCount').textContent = completed.length;
            
            const totalXpEarned = completed.reduce((sum, q) => sum + (q.xp_reward || 0), 0);
            document.getElementById('totalXPEarned').textContent = totalXpEarned;
        }

        // ========================================
        // ✅ FIXED: Get quest ID as string
        // ========================================
        function getQuestId(quest) { return String(quest.id); }

        // ========================================
        // ✅ FIXED: QUEST ACTIONS
        // ========================================
        window.startQuest = function(questId) {
            const id = String(questId);
            if (questClueState[id]) {
                questClueState[id].started = true;
                questClueState[id].currentClue = 0;
                questClueRenderTrigger++;
            }
            renderQuests();
        };

        window.nextClue = function(questId) {
            const id = String(questId);
            const state = questClueState[id];
            if (state) {
                const quest = allQuests.find(q => String(q.id) === id);
                if (quest && state.currentClue < quest.clues.length - 1) {
                    state.currentClue++;
                    questClueRenderTrigger++;
                    renderQuests();
                }
            }
        };

    // ========================================
// ✅ SUBMIT ANSWER - FIXED
// ========================================
window.submitAnswer = function(questId) {
    const id = String(questId);
    const input = document.getElementById(`answer-input-${id}`);
    const feedback = document.getElementById(`answer-feedback-${id}`);
    const quest = allQuests.find(q => String(q.id) === id);
    
    if (!input || !quest || questAnswerState[id]?.locked) return;
    
    const userAnswer = input.value.trim();
    const correctAnswer = quest.answer;
    
    if (!userAnswer) {
        feedback.className = 'answer-feedback info';
        feedback.textContent = '📝 Please type your answer first.';
        feedback.style.display = 'block';
        return;
    }
    
    const isCorrect = userAnswer.toLowerCase() === correctAnswer.toLowerCase() ||
                     correctAnswer.toLowerCase().includes(userAnswer.toLowerCase()) ||
                     userAnswer.toLowerCase().includes(correctAnswer.toLowerCase()) ||
                     userAnswer.toLowerCase().replace(/\s/g, '') === correctAnswer.toLowerCase().replace(/\s/g, '');
    
    if (isCorrect) {
        feedback.className = 'answer-feedback correct';
        feedback.textContent = '✅ Correct! Well done!';
        feedback.style.display = 'block';
        questAnswerState[id].locked = true;
        input.disabled = true;
        
        // ✅ Complete the quest (updates state immediately)
        setTimeout(async () => {
            const result = await completeQuest(quest.id);
            console.log('Quest completion result:', result);
            
            // ✅ Update header and stats
            updateHeader();
            updateStats();
            
            // ✅ Re-render quests (will show as completed)
            renderQuests();
        }, 300);
        
    } else {
        questAnswerState[id].attempts = (questAnswerState[id].attempts || 0) + 1;
        const remaining = 3 - questAnswerState[id].attempts;
        
        feedback.className = 'answer-feedback wrong';
        feedback.textContent = `❌ Not quite. ${remaining} attempts remaining.`;
        feedback.style.display = 'block';
        
        if (questAnswerState[id].attempts >= 3) {
            feedback.textContent = `💡 The correct answer is: "${correctAnswer}"`;
            questAnswerState[id].locked = true;
            input.disabled = true;
        }
        
        input.value = '';
        input.focus();
    }
};          //==========
        // ✅ FIXED: RENDER QUESTS
        // ========================================
        function renderQuests() {
            if (!questList) return;

            const state = getState();
            const discoveries = state.user?.discoveries || [];
            const completedQuests = state.user?.completedQuests || [];

            console.log('🔄 Rendering quests. Completed:', completedQuests);

            if (!allQuests || allQuests.length === 0) {
                questList.innerHTML = `<div class="empty-state" style="text-align:center; padding:40px;"><span style="font-size:48px; display:block; margin-bottom:12px;">🎯</span><p style="color:var(--text-muted);">No quests available</p></div>`;
                return;
            }

            let filteredQuests = allQuests;
            if (currentFilter === 'active') {
                filteredQuests = allQuests.filter(q => !completedQuests.includes(q.id) && (q.is_disclosed || discoveries.length >= 2));
            } else if (currentFilter === 'completed') {
                filteredQuests = allQuests.filter(q => completedQuests.includes(q.id));
            }

            if (filteredQuests.length === 0) {
                questList.innerHTML = `<div class="empty-state" style="text-align:center; padding:40px;"><span style="font-size:48px; display:block; margin-bottom:12px;"></span><p style="color:var(--text-muted);">No quests match your filter</p></div>`;
                return;
            }

            questList.innerHTML = filteredQuests.map(quest => {
                const questId = String(quest.id);
                const isCompleted = completedQuests.includes(quest.id);
                const locationDiscovered = discoveries.includes(quest.location_id);
                const isDisclosed = quest.is_disclosed || discoveries.length >= 2;
                const isLocked = !isDisclosed && !isCompleted;
                
                const clueState = questClueState[questId] || { currentClue: 0, started: false };
                const currentClueIndex = clueState.started ? clueState.currentClue : -1;
                const totalClues = quest.clues ? quest.clues.length : 0;
                const allCluesRevealed = clueState.started && currentClueIndex >= totalClues - 1;
                const answerState = questAnswerState[questId] || { attempts: 0, locked: false };

                // ✅ Determine status
                let statusText, statusClass, rewardClass = '';
                if (isCompleted) {
                    statusText = '✅ Completed';
                    statusClass = 'completed';
                    rewardClass = 'completed-reward';
                } else if (isLocked) {
                    statusText = '🔒 Locked';
                    statusClass = 'locked';
                } else if (clueState.started) {
                    statusText = ' In Progress';
                    statusClass = 'active';
                } else {
                    statusText = '📋 Available';
                    statusClass = 'active';
                }

                // ✅ Build clue display
                let clueHTML = '';
                let answerHTML = '';
                let completionHTML = '';

                if (isCompleted && quest.completionMessage) {
                    completionHTML = `
                        <div class="completion-message">
                            <span class="msg-icon">${quest.completionIcon || ''}</span>
                            <div class="msg-text">${quest.completionMessage}</div>
                        </div>
                    `;
                }

                if (!isLocked && !isCompleted) {
                    if (clueState.started && currentClueIndex >= 0 && totalClues > 0) {
                        const currentClue = quest.clues[currentClueIndex];
                        const showAnswer = allCluesRevealed;
                        
                        clueHTML = `
                            <div class="clue-box">
                                <div>
                                    <span class="clue-number"> Clue ${currentClueIndex + 1} of ${totalClues}</span>
                                    <div class="clue-text">"${currentClue.text}"</div>
                                </div>
                            </div>
                            <div class="step-indicator">
                                ${quest.clues.map((_, idx) => `
                                    <span class="step-dot ${idx < currentClueIndex ? 'completed-dot' : idx === currentClueIndex ? 'active' : ''}"></span>
                                `).join('')}
                            </div>
                            <div class="clue-counter">${currentClueIndex + 1} / ${totalClues} clues revealed</div>
                        `;
                        
                        if (showAnswer) {
                            const isLockedOut = answerState.locked;
                            const attempts = answerState.attempts || 0;
                            const remaining = 3 - attempts;
                            
                            answerHTML = `
                                <div class="answer-section">
                                    <div class="answer-row">
                                        <input type="text" id="answer-input-${questId}" 
                                               placeholder="Type your answer..." 
                                               ${isLockedOut || isCompleted ? 'disabled' : ''}
                                               onkeydown="if(event.key==='Enter') submitAnswer('${questId}')">
                                        <button class="btn-submit" onclick="submitAnswer('${questId}')" 
                                                ${isLockedOut || isCompleted ? 'disabled' : ''}>
                                            ✅ Submit
                                        </button>
                                    </div>
                                    <div id="answer-feedback-${questId}" class="answer-feedback"></div>
                                    ${isLockedOut ? `
                                        <div style="color:var(--text-yellow); font-size:13px; margin-top:4px;">
                                            💡 The correct answer is: <strong>${quest.answer}</strong>
                                        </div>
                                    ` : `
                                        <div style="color:var(--text-muted); font-size:12px; margin-top:4px;">
                                            💡 ${remaining} attempt${remaining > 1 ? 's' : ''} remaining
                                        </div>
                                    `}
                                </div>
                            `;
                        }
                    } else if (!clueState.started) {
                        clueHTML = `
                            <div class="clue-box">
                                <div class="locked-clue"> Click "Start Quest" to begin your adventure!</div>
                            </div>
                        `;
                    }
                }

                // ✅ Build actions
                let actionsHTML = '';
                if (isCompleted) {
                    actionsHTML = `<button class="btn-completed">✅ Completed</button>`;
                } else if (isLocked) {
                    actionsHTML = `<span style="font-size:13px; color:var(--text-muted);">🔒 Discover 2 locations to unlock</span>`;
                } else if (!clueState.started) {
                    actionsHTML = `<button class="btn-start" onclick="window.startQuest('${questId}')">🚀 Start Quest</button>`;
                } else if (clueState.started && !allCluesRevealed) {
                    actionsHTML = `<button class="btn-next" onclick="window.nextClue('${questId}')">🔍 Next Clue →</button>`;
                }

                const lockOverlay = isLocked ? `
                    <div class="locked-overlay">
                        <span class="lock-icon">🔒</span>
                        <span class="lock-text">Discover 2 locations to unlock</span>
                    </div>
                ` : '';

                return `
                    <div class="quest-card ${isCompleted ? 'completed' : ''} ${isLocked ? 'locked' : ''}">
                        ${lockOverlay}
                        <div class="quest-header">
                            <span class="quest-icon">${quest.icon || '📋'}</span>
                            <span class="quest-title">${quest.title || 'Quest'}</span>
                            <span class="quest-status ${statusClass}">${statusText}</span>
                        </div>
                        
                        <div class="quest-reward ${rewardClass}"> +${quest.xp_reward || 0} XP</div>
                        
                        ${completionHTML}
                        ${clueHTML}
                        ${answerHTML}
                        
                        <div class="quest-actions">${actionsHTML}</div>
                    </div>
                `;
            }).join('');
        }

        // ========================================
        // FILTERS
        // ========================================
        document.querySelectorAll('.quest-filter .filter-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.quest-filter .filter-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentFilter = this.dataset.filter;
                renderQuests();
            });
        });

        // ========================================
        // SUBSCRIBE
        // ========================================
        subscribe((state) => {
            console.log('🔄 Quests page: State changed!');
            allQuests = questsData;
            updateHeader();
            updateStats();
            renderQuests();
        });

        // ========================================
        // INIT
        // ========================================
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', loadData);
        } else {
            loadData();
        }
    </script>
</body>
</html>
