<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Choose new password - LOST@UET</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="css/style.css" />
    <style>
        body { background: var(--dark-bg); min-height: 100vh; margin: 0; }
        #app { width: 100%; min-height: 100vh; }
        .auth-page { display: flex; align-items: center; justify-content: center; min-height: 85vh; padding: 20px; }
        .auth-box { background: var(--card-bg); border: 2px solid var(--border-blue); border-radius: 16px; padding: 40px 36px; max-width: 400px; width: 100%; box-shadow: 0 8px 32px rgba(0,0,0,.3); }
        .auth-logo { text-align: center; margin-bottom: 28px; }
        .auth-logo .logo-icon { font-size: 48px; display: block; }
        .auth-logo h1, .auth-box h2 { font-family: var(--font-pixel); color: var(--text-yellow); text-align: center; }
        .auth-logo h1 { font-size: 24px; margin: 8px 0; letter-spacing: 2px; }
        .auth-logo p { font-family: var(--font-retro); color: var(--text-muted); letter-spacing: 4px; font-size: 14px; }
        .auth-box h2 { font-size: 16px; margin: 0 0 22px; }
        .input-group { margin-bottom: 16px; }
        label { display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 5px; font-weight: 600; text-transform: uppercase; }
        input { width: 100%; box-sizing: border-box; padding: 12px 48px 12px 14px; background: var(--dark-bg); border: 2px solid var(--border-blue); border-radius: 8px; color: var(--text-white); font-size: 14px; font-family: var(--font-body); }
        input:focus { outline: none; border-color: var(--text-yellow); box-shadow: 0 0 0 3px rgba(247,184,1,.15); }
        .password-wrap { position: relative; }
        .password-toggle { position: absolute; right: 9px; top: 50%; transform: translateY(-50%); width: 32px; height: 32px; border: 0; border-radius: 6px; background: transparent; color: var(--text-muted); cursor: pointer; }
        .password-toggle:hover, .password-toggle:focus-visible { color: var(--text-yellow); background: rgba(247,184,1,.12); }
        .password-toggle:focus-visible { outline: 2px solid var(--text-yellow); outline-offset: 2px; }
        .btn-yellow { width: 100%; padding: 13px; border-radius: 8px; font-weight: 700; cursor: pointer; background: var(--text-yellow); color: #111; border: 0; }
        .message { display: none; padding: 10px 12px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; line-height: 1.4; }
        .message.error { background: rgba(255,107,107,.15); color: #ff6b6b; border-left: 3px solid #ff6b6b; }
        .message.success { background: rgba(76,175,80,.15); color: #4caf50; border-left: 3px solid #4caf50; }
        .auth-link { text-align: center; margin-top: 18px; color: var(--text-muted); font-size: 13px; }
        .auth-link a { color: var(--text-yellow); text-decoration: none; font-weight: 600; }
        @media (max-width: 480px) { .auth-box { padding: 28px 20px; } .auth-logo h1 { font-size: 20px; } }
    </style>
</head>
<body>
    <div id="app">
        <header id="global-header"><div class="header-left"><span class="logo-text">LOST@UET</span></div></header>
        <main class="auth-page">
            <section class="auth-box" aria-labelledby="pageTitle">
                <div class="auth-logo"><span class="logo-icon">🏛️</span><h1>LOST@UET</h1><p>EXPLORE · DISCOVER · BELONG</p></div>
                <h2 id="pageTitle">NEW PASSWORD</h2>
                <div class="message error" id="errorMessage" role="alert"></div>
                <div class="message success" id="successMessage" role="status"></div>
                <form id="resetForm">
                    <div class="input-group"><label for="newPassword"><i class="fas fa-lock"></i> New password</label><div class="password-wrap"><input type="password" id="newPassword" required minlength="6" autocomplete="new-password" /><button type="button" class="password-toggle" data-target="newPassword" aria-label="Show password" aria-pressed="false" title="Show password"><i class="fas fa-eye" aria-hidden="true"></i></button></div></div>
                    <div class="input-group"><label for="confirmPassword"><i class="fas fa-lock"></i> Confirm password</label><div class="password-wrap"><input type="password" id="confirmPassword" required minlength="6" autocomplete="new-password" /><button type="button" class="password-toggle" data-target="confirmPassword" aria-label="Show password" aria-pressed="false" title="Show password"><i class="fas fa-eye" aria-hidden="true"></i></button></div></div>
                    <button type="submit" class="btn-yellow" id="updatePasswordBtn"><i class="fas fa-key"></i> UPDATE PASSWORD</button>
                </form>
                <div class="auth-link"><a href="index.html">Back to login</a></div>
            </section>
        </main>
    </div>
    <script type="module">
        import { supabase } from './js/config.js';
        import { updatePassword } from './js/auth.js';
        const form = document.getElementById('resetForm');
        const newPassword = document.getElementById('newPassword');
        const confirmPassword = document.getElementById('confirmPassword');
        const button = document.getElementById('updatePasswordBtn');
        const error = document.getElementById('errorMessage');
        const success = document.getElementById('successMessage');
        document.querySelectorAll('.password-toggle').forEach((toggle) => toggle.addEventListener('click', () => {
            const input = document.getElementById(toggle.dataset.target);
            const visible = input.type === 'text';
            input.type = visible ? 'password' : 'text';
            toggle.setAttribute('aria-pressed', String(!visible));
            toggle.setAttribute('aria-label', visible ? 'Show password' : 'Hide password');
            toggle.title = visible ? 'Show password' : 'Hide password';
            toggle.querySelector('i').className = visible ? 'fas fa-eye' : 'fas fa-eye-slash';
        }));
        supabase.auth.onAuthStateChange((event) => {
            if (event === 'PASSWORD_RECOVERY') form.style.display = 'block';
        });
        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            error.style.display = 'none'; success.style.display = 'none';
            if (newPassword.value.length < 6) { error.textContent = 'Password must be at least 6 characters.'; error.style.display = 'block'; return; }
            if (newPassword.value !== confirmPassword.value) { error.textContent = 'Passwords do not match.'; error.style.display = 'block'; return; }
            button.disabled = true; button.innerHTML = '<i class="fas fa-spinner fa-spin"></i> UPDATING...';
            try {
                await updatePassword(newPassword.value);
                success.textContent = 'Password updated successfully. Redirecting to login...';
                success.style.display = 'block'; form.reset();
                setTimeout(() => { window.location.href = 'index.html'; }, 1800);
            } catch (err) {
                error.textContent = err.message || 'This reset link is invalid or expired. Request a new one.';
                error.style.display = 'block';
            } finally {
                button.disabled = false; button.innerHTML = '<i class="fas fa-key"></i> UPDATE PASSWORD';
            }
        });
    </script>
</body>
</html>
