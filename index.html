<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Login - LOST@UET</title>

    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="css/style.css" />
    
    <style>
        .auth-page {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 75vh;
            padding: 20px;
        }
        .auth-box {
            background: var(--card-bg);
            border: 2px solid var(--border-blue);
            border-radius: 16px;
            padding: 40px 36px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        .auth-box .auth-logo { text-align: center; margin-bottom: 28px; }
        .auth-box .auth-logo .logo-icon { font-size: 48px; display: block; }
        .auth-box .auth-logo h1 {
            font-family: var(--font-pixel);
            font-size: 24px;
            color: var(--text-yellow);
            margin-top: 8px;
            letter-spacing: 2px;
        }
        .auth-box .auth-logo p {
            font-family: var(--font-retro);
            font-size: 14px;
            color: var(--text-muted);
            letter-spacing: 4px;
        }
        .auth-box h2 {
            font-family: var(--font-pixel);
            font-size: 16px;
            color: var(--text-yellow);
            text-align: center;
            margin-bottom: 24px;
        }
        .auth-box .input-group { margin-bottom: 16px; }
        .auth-box label {
            display: block;
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 5px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .auth-box label i { margin-right: 6px; }
        .auth-box input {
            width: 100%;
            padding: 12px 14px;
            background: var(--dark-bg);
            border: 2px solid var(--border-blue);
            border-radius: 8px;
            color: var(--text-white);
            font-size: 14px;
            font-family: var(--font-body);
            transition: border-color 0.2s;
        }
        .auth-box input:focus {
            outline: none;
            border-color: var(--text-yellow);
            box-shadow: 0 0 0 3px rgba(247, 184, 1, 0.15);
        }
        .auth-box input::placeholder { color: var(--text-muted); opacity: 0.5; }
        .auth-box .btn-yellow {
            width: 100%;
            margin-top: 8px;
            padding: 14px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
        }
        .auth-box .auth-link {
            text-align: center;
            margin-top: 18px;
            color: var(--text-muted);
            font-size: 13px;
        }
        .auth-box .auth-link a { color: var(--text-yellow); text-decoration: none; font-weight: 600; }
        .auth-box .auth-link a:hover { text-decoration: underline; }
        .auth-error {
            background: rgba(255, 107, 107, 0.15);
            color: #FF6B6B;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
            border-left: 3px solid #FF6B6B;
        }
        .auth-success {
            background: rgba(76, 175, 80, 0.15);
            color: #4CAF50;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
            border-left: 3px solid #4CAF50;
        }
        .auth-loading {
            text-align: center;
            padding: 10px;
            color: var(--text-muted);
            font-size: 13px;
            display: none;
        }
        .auth-loading .spinner-small {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid var(--border-blue);
            border-top: 2px solid var(--text-yellow);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @media (max-width: 480px) {
            .auth-box { padding: 28px 20px; }
            .auth-box .auth-logo h1 { font-size: 20px; }
        }
    </style>
</head>
<body>
    <div id="app">

        <!-- HEADER -->
        <header id="global-header">
            <div class="header-left">
                <span class="logo-icon">🏛️</span>
                <span class="logo-text">LOST@UET</span>
            </div>
            <nav class="header-nav">
                <a href="home.html">Home</a>
                <a href="map.html">Map</a>
                <a href="quests.html">Quests</a>
                <a href="discoveries.html">Discoveries</a>
                <a href="index.html" class="active">Login</a>
            </nav>
            <div class="header-profile" id="userProfile" style="display:none;">
                <div class="avatar">👤</div>
                <div class="profile-info">
                    <span class="level-text" id="userDisplayName">Explorer</span>
                    <div class="mini-progress"><div class="mini-progress-bar" id="userProgressBar" style="width:0%;"></div></div>
                    <span class="progress-text" id="userProgressText">0/42</span>
                </div>
            </div>
        </header>

        <!-- LOGIN FORM -->
        <div class="auth-page">
            <div class="auth-box">
                <div class="auth-logo">
                    <span class="logo-icon">🏛️</span>
                    <h1>LOST@UET</h1>
                    <p>EXPLORE · DISCOVER · BELONG</p>
                </div>

                <h2>🔐 LOGIN</h2>

                <div class="auth-error" id="authError"></div>
                <div class="auth-success" id="authSuccess"></div>
                <div class="auth-loading" id="authLoading">
                    <span class="spinner-small"></span> Logging in...
                </div>

                <form id="loginForm">
                    <div class="input-group">
                        <label><i class="fas fa-envelope"></i> Email</label>
                        <input type="email" id="loginEmail" placeholder="Enter your email" required autocomplete="email" />
                    </div>
                    <div class="input-group">
                        <label><i class="fas fa-lock"></i> Password</label>
                        <input type="password" id="loginPassword" placeholder="Enter your password" required autocomplete="current-password" />
                    </div>
                    <button type="button" class="btn-yellow" id="loginBtn">
                        <i class="fas fa-sign-in-alt"></i> LOGIN
                    </button>
                </form>

                <div class="auth-link">
                    Don't have an account? <a href="signup.html">Sign Up</a>
                </div>
            </div>
        </div>

        <!-- BOTTOM NAV -->
        <nav class="bottom-nav">
            <a href="home.html"><i class="fas fa-home"></i> Home</a>
            <a href="map.html"><i class="fas fa-map"></i> Map</a>
            <a href="quests.html"><i class="fas fa-tasks"></i> Quests</a>
            <a href="discoveries.html"><i class="fas fa-trophy"></i> Discoveries</a>
            <a href="index.html" class="active"><i class="fas fa-user"></i> Login</a>
        </nav>

        <nav class="mobile-nav">
            <a href="home.html"><i class="fas fa-home"></i> Home</a>
            <a href="map.html"><i class="fas fa-map"></i> Map</a>
            <a href="quests.html"><i class="fas fa-tasks"></i> Quests</a>
            <a href="discoveries.html"><i class="fas fa-trophy"></i> Discoveries</a>
            <a href="index.html" class="active"><i class="fas fa-user"></i> Login</a>
        </nav>

    </div>

    <script type="module">
        import { signIn, getCurrentUser } from './js/auth.js';

        // ========================================
        // DOM ELEMENTS
        // ========================================
        const loginBtn = document.getElementById('loginBtn');
        const emailInput = document.getElementById('loginEmail');
        const passwordInput = document.getElementById('loginPassword');
        const errorEl = document.getElementById('authError');
        const successEl = document.getElementById('authSuccess');
        const loadingEl = document.getElementById('authLoading');

        // ========================================
        // SHOW/HIDE HELPERS
        // ========================================
        function showError(message) {
            errorEl.textContent = '❌ ' + message;
            errorEl.style.display = 'block';
            successEl.style.display = 'none';
        }

        function showSuccess(message) {
            successEl.textContent = '✅ ' + message;
            successEl.style.display = 'block';
            errorEl.style.display = 'none';
        }

        function hideMessages() {
            errorEl.style.display = 'none';
            successEl.style.display = 'none';
            loadingEl.style.display = 'none';
        }

        function setLoading(isLoading) {
            if (isLoading) {
                loadingEl.style.display = 'block';
                loginBtn.disabled = true;
                loginBtn.innerHTML = '<span class="spinner-small"></span> LOGGING IN...';
            } else {
                loadingEl.style.display = 'none';
                loginBtn.disabled = false;
                loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> LOGIN';
            }
        }

        // ========================================
        // HANDLE LOGIN
        // ========================================
        async function handleLogin() {
            hideMessages();

            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();

            if (!email) {
                showError('Please enter your email');
                emailInput.focus();
                return;
            }

            if (!password) {
                showError('Please enter your password');
                passwordInput.focus();
                return;
            }

            setLoading(true);

            try {
                console.log('Attempting login for:', email);
                const result = await signIn(email, password);
                console.log('Login result:', result);
                
                if (result && result.user) {
                    localStorage.setItem('user', JSON.stringify(result.user));
                    
                    showSuccess('Login successful! Redirecting...');
                    setTimeout(() => {
                        window.location.href = 'home.html';
                    }, 1500);
                } else {
                    showError('Invalid email or password');
                    setLoading(false);
                }
            } catch (error) {
                console.error('Login error:', error);
                showError(error.message || 'Something went wrong. Please try again.');
                setLoading(false);
            }
        }

        // ========================================
        // EVENT LISTENERS
        // ========================================
        loginBtn.addEventListener('click', handleLogin);

        passwordInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                handleLogin();
            }
        });

        emailInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                passwordInput.focus();
            }
        });

        // ========================================
        // CHECK IF USER IS ALREADY LOGGED IN
        // ========================================
        async function checkAuth() {
            try {
                const user = await getCurrentUser();
                if (user && user.success) {
                    window.location.href = 'home.html';
                }
            } catch (error) {
                console.log('Not logged in');
            }
        }

        checkAuth();
    </script>
</body>
</html>
