<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />

    <title>LOST@UET - Campus Explorer</title>

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Inter:wght@400;600;700;800&display=swap"
        rel="stylesheet"
    />

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <!-- Main CSS -->
    <link rel="stylesheet" href="css/style.css" />
</head>

<body>

    <div id="app">

        <!-- ======================================== -->
        <!-- GLOBAL HEADER -->
        <!-- ======================================== -->

        <header id="global-header">

            <div class="header-left">
                <span class="logo-icon">🏛️</span>
                <span class="logo-text">LOST@UET</span>
            </div>

            <nav class="header-nav">
                <a href="index.html" class="active">Home</a>
                <a href="map.html">Map</a>
                <a href="quests.html">Quests</a>
                <a href="discoveries.html">Discoveries</a>
            </nav>

            <div class="header-profile">

                <div class="avatar">👤</div>

                <div class="profile-info">

                   <span class="level-text" id="level-text">
    Lv. 1 Explorer
</span>

                    <div class="mini-progress">
                        <div
    class="mini-progress-bar"
    id="mini-progress-bar"
    style="width:0%;"
></div>
                    </div>

                  <span class="progress-text" id="progress-text">
    0 XP
</span>

                </div>

            </div>

        </header>


        <!-- ======================================== -->
        <!-- LANDING PAGE -->
        <!-- ======================================== -->

        <section class="page active">

            <div class="landing-container">

                <div class="landing-banner">

                    <h1 class="landing-title">
                        LOST@UET
                    </h1>

                    <p class="landing-tagline">
                        EXPLORE · DISCOVER · BELONG
                    </p>

                </div>


                <div class="pixel-art-container">

                    <div class="pixel-building">

                        <div class="building-block"></div>
                        <div class="building-block"></div>
                        <div class="building-block"></div>

                        <div class="building-window"></div>
                        <div class="building-window"></div>
                        <div class="building-window"></div>

                    </div>

                    <div class="student-avatar">
                        🧑‍🎓
                    </div>

                </div>


                <div class="speech-bubble">
                    NEW CAMPUS. SAME YOU. JUST MORE LOST.
                </div>


                <!-- ======================================== -->
                <!-- BUTTONS -->
                <!-- ======================================== -->

                <div class="button-stack">

                    <!-- AUTH BUTTON -->
                    <button
                        id="auth-button"
                        class="btn-outline"
                    >
                        LOGIN / SIGN UP
                    </button>


                    <a
                        href="map.html"
                        class="btn-yellow"
                        style="text-decoration:none;text-align:center;"
                    >
                        START EXPLORING
                    </a>


                    <a
                        href="map.html"
                        class="btn-outline"
                        style="text-decoration:none;text-align:center;"
                    >
                        EXPLORE MAP
                    </a>


                    <a
                        href="quests.html"
                        class="btn-outline"
                        style="text-decoration:none;text-align:center;"
                    >
                        VIEW QUESTS
                    </a>


                    <a
                        href="discoveries.html"
                        class="btn-outline"
                        style="text-decoration:none;text-align:center;"
                    >
                        MY DISCOVERIES
                    </a>

                </div>

            </div>

        </section>


        <!-- ======================================== -->
        <!-- AUTH MODAL -->
        <!-- ======================================== -->

        <div id="auth-modal" class="modal">

            <div class="modal-content">

                <button
                    class="modal-close"
                    id="auth-close"
                    type="button"
                >
                    ✕
                </button>


                <div class="modal-icon">
                    👤
                </div>


                <h3 id="auth-title">
                    LOGIN
                </h3>


                <!-- ======================================== -->
                <!-- LOGIN FORM -->
                <!-- ======================================== -->

                <form id="login-form">

                    <input
                        type="email"
                        id="login-email"
                        placeholder="Email"
                        required
                    />


                    <input
                        type="password"
                        id="login-password"
                        placeholder="Password"
                        required
                    />


                    <button
                        type="submit"
                        class="btn-yellow"
                    >
                        LOGIN
                    </button>

                </form>


                <!-- ======================================== -->
                <!-- SIGNUP FORM -->
                <!-- ======================================== -->

                <form
                    id="signup-form"
                    style="display:none;"
                >

                    <input
                        type="text"
                        id="signup-name"
                        placeholder="Your Name"
                        required
                    />


                    <input
                        type="email"
                        id="signup-email"
                        placeholder="Email"
                        required
                    />


                    <input
                        type="password"
                        id="signup-password"
                        placeholder="Password"
                        required
                        minlength="6"
                    />


                    <button
                        type="submit"
                        class="btn-yellow"
                    >
                        CREATE ACCOUNT
                    </button>

                </form>


                <!-- ======================================== -->
                <!-- SWITCH LOGIN / SIGNUP -->
                <!-- ======================================== -->

                <p id="auth-switch">

                    Don't have an account?

                    <button
                        type="button"
                        id="show-signup"
                    >
                        Sign Up
                    </button>

                </p>

            </div>

        </div>


        <!-- ======================================== -->
        <!-- BOTTOM NAVIGATION -->
        <!-- ======================================== -->

        <nav class="bottom-nav">

            <a
                href="index.html"
                class="active"
            >
                <i class="fas fa-home"></i>
                Home
            </a>

            <a href="map.html">
                <i class="fas fa-map"></i>
                Map
            </a>

            <a href="quests.html">
                <i class="fas fa-tasks"></i>
                Quests
            </a>

            <a href="discoveries.html">
                <i class="fas fa-trophy"></i>
                Discoveries
            </a>

        </nav>


        <!-- ======================================== -->
        <!-- MOBILE BOTTOM NAV -->
        <!-- ======================================== -->

        <nav class="mobile-nav">

            <a
                href="index.html"
                class="active"
            >
                <i class="fas fa-home"></i>
                Home
            </a>

            <a href="map.html">
                <i class="fas fa-map"></i>
                Map
            </a>

            <a href="quests.html">
                <i class="fas fa-tasks"></i>
                Quests
            </a>

            <a href="discoveries.html">
                <i class="fas fa-trophy"></i>
                Discoveries
            </a>

        </nav>

    </div>

    <!-- ======================================== -->
    <!-- MAIN JAVASCRIPT -->
    <!-- ======================================== -->

    <script
        type="module"
        src="js/app.js"
    ></script>

</body>
</html>
