<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Discoveries - LOST@UET</title>
    <meta name="description" content="Track the UET Lahore campus locations you have discovered through LOST@UET QR challenges." />
    <meta name="robots" content="noindex,nofollow" />

    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/navigation.css" />
    <style>html:not(.auth-ready) body { visibility: hidden; }</style>
    <script type="module" src="js/route-guard.js"></script>
</head>
<body>
    <div id="app">

        <!-- HEADER -->
        <header id="global-header">
            <div class="header-left">
                <span class="logo-text">LOST@UET</span>
            </div>
            <nav class="header-nav">
                <a href="home.html">Home</a>
                <a href="map.html">Map</a>
                <a href="quests.html">Quests</a>
                <a href="discoveries.html" class="active">Discoveries</a>
                <a href="societies.html">Societies</a>
                <a href="faq.html"> FAQ</a>
            </nav>
            <div class="header-profile" id="userProfile">
                <div class="avatar">👤</div>
                <div class="profile-info">
                    <span class="level-text" id="userDisplayName">Loading...</span>
                    <div class="mini-progress">
                        <div class="mini-progress-bar" id="userProgressBar" style="width:0%;"></div>
                    </div>
                    <span class="progress-text" id="userProgressText">0/42</span>
                </div>
            </div>
        </header>

        <!-- DISCOVERIES PAGE -->
        <section class="page active">
            <div class="page-header">
                <h2>MY DISCOVERIES</h2>
                <div class="level-bar">
                    <span>📍 <span id="discoveryCount">0</span> / <span id="totalLocations">0</span> locations</span>
                    <span>⭐ <span id="discoveryXP">0</span> XP (Level <span id="discoveryLevel">1</span>)</span>
                </div>
            </div>

            <!-- Discovery Progress -->
            <div class="discovery-progress">
                <div class="progress-label">
                    <span>Progress</span>
                    <span id="progressPercent">0%</span>
                </div>
                <div class="progress-bar-full">
                    <div class="progress-fill-full" id="discoveryProgressBar" style="width:0%;"></div>
                </div>
            </div>

            <!-- Discovery Stats -->
            <div class="discovery-stats">
                <div class="stat-card">
                    <span class="stat-number" id="discoveredCount">0</span>
                    <span class="stat-label"> Unlocked</span>
                </div>
                <div class="stat-card">
                    <span class="stat-number" id="lockedCount">0</span>
                    <span class="stat-label">Locked</span>
                </div>
                <div class="stat-card">
                    <span class="stat-number" id="totalXP">0</span>
                    <span class="stat-label">⭐ XP Earned</span>
                </div>
            </div>

            <!-- Location Grid -->
            <h3 style="font-family:var(--font-pixel);font-size:14px;color:var(--text-yellow);margin:20px 0 12px;">📍 ALL LOCATIONS</h3>
            <div class="discovery-grid" id="discoveriesGrid">
                <div class="loading-spinner" style="grid-column:1/-1;">
                    <div class="spinner"></div>
                    <p style="margin-top:12px;color:var(--text-muted);">Loading locations...</p>
                </div>
            </div>

           

            <!-- Export/Import -->
            <div class="save-actions">
                <button class="btn-outline" onclick="exportSave()">💾 Export Save</button>
                <button class="btn-outline" onclick="document.getElementById('importFile').click()">📂 Import Save</button>
                <input type="file" id="importFile" accept=".json" style="display:none;" onchange="importSave(event)" />
            </div>
        </section>

        <!-- BOTTOM NAV -->
        <nav class="bottom-nav">
            <a href="home.html"><i class="fas fa-home"></i> Home</a>
            <a href="map.html"><i class="fas fa-map"></i> Map</a>
            <a href="quests.html"><i class="fas fa-tasks"></i> Quests</a>
            <a href="discoveries.html" class="active"><i class="fas fa-trophy"></i> Discoveries</a>
             <a href="societies.html"><i class="fas fa-users"></i> Societies</a>
             <a href="faq.html">
      <i class="fas fa-question-circle"></i> FAQ
  </a>
        </nav>

        <nav class="mobile-nav">
            <a href="home.html"><i class="fas fa-home"></i> Home</a>
            <a href="map.html"><i class="fas fa-map"></i> Map</a>
            <a href="quests.html"><i class="fas fa-tasks"></i> Quests</a>
            <a href="discoveries.html" class="active"><i class="fas fa-trophy"></i> Discoveries</a>
             <a href="societies.html"><i class="fas fa-users"></i> Societies</a>
             <a href="faq.html">
      <i class="fas fa-question-circle"></i> FAQ
  </a>
        </nav>

    </div>

    <script type="module">
        import { getCurrentUser } from './js/auth.js';
        import { 
            loadGameData, 
            getState, 
            getTotalXP, 
            getLevel, 
            getTotalDiscoveries, 
            getTotalLocations, 
            getLocationStatus,
            getCompletionPercentage,
            subscribe,
            refreshUserData,
            refreshLocations
        } from './js/dataService.js';

        
        const grid = document.getElementById('discoveriesGrid');
        const displayName = document.getElementById('userDisplayName');
        const progressBar = document.getElementById('userProgressBar');
        const progressText = document.getElementById('userProgressText');

        
        subscribe((state) => {
            console.log('🔄 Discoveries page: State changed!');
            updateHeader();
            updateStats();
            renderDiscoveries();
        });

      
        async function loadData() {
            try {
                const user = await getCurrentUser();
                if (!user || !user.success) {
                    window.location.href = 'index.html';
                    return;
                }

                await loadGameData();
                const state = getState();
                
                updateHeader();
                updateStats();
                renderDiscoveries();
                
            } catch (error) {
                console.error('Error loading data:', error);
            }
        }

        
        function updateHeader() {
            const state = getState();
            const user = state.user;
            const discoveries = getTotalDiscoveries();
            const total = getTotalLocations();
            const progress = getCompletionPercentage();

            if (displayName) {
                displayName.textContent = user?.name || user?.username || 'Explorer';
            }
            if (progressBar) {
                progressBar.style.width = progress + '%';
            }
            if (progressText) {
                progressText.textContent = `${discoveries}/${total}`;
            }
        }

        
        function updateStats() {
            const discovered = getTotalDiscoveries();
            const total = getTotalLocations();
            const progress = getCompletionPercentage();
            const xp = getTotalXP();
            const level = getLevel();

            const discoveryCount = document.getElementById('discoveryCount');
            const totalLocations = document.getElementById('totalLocations');
            const discoveryXP = document.getElementById('discoveryXP');
            const discoveryLevel = document.getElementById('discoveryLevel');
            const progressPercent = document.getElementById('progressPercent');
            const discoveryProgressBar = document.getElementById('discoveryProgressBar');
            const discoveredCount = document.getElementById('discoveredCount');
            const lockedCount = document.getElementById('lockedCount');
            const totalXP = document.getElementById('totalXP');

            if (discoveryCount) discoveryCount.textContent = discovered;
            if (totalLocations) totalLocations.textContent = total;
            if (discoveryXP) discoveryXP.textContent = xp;
            if (discoveryLevel) discoveryLevel.textContent = level;
            if (progressPercent) progressPercent.textContent = progress + '%';
            if (discoveryProgressBar) discoveryProgressBar.style.width = progress + '%';
            if (discoveredCount) discoveredCount.textContent = discovered;
            if (lockedCount) lockedCount.textContent = total - discovered;
            if (totalXP) totalXP.textContent = xp;
        }

      
        function renderDiscoveries() {
            if (!grid) return;

            const state = getState();
            const locations = state.locations || [];

            console.log('📍 Rendering discoveries, locations:', locations.length);

            if (locations.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state" style="grid-column:1/-1;">
                        <span class="empty-icon">🔍</span>
                        <p>No locations found</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = locations.map(loc => {
                const isDiscovered = getLocationStatus(loc.id) === 'discovered';
                return `
                    <div class="discovery-item ${isDiscovered ? 'unlocked' : 'locked'}"
                         onclick="window.openLocation('${loc.id}')">
                        <span>${loc.icon || '📍'}</span>
                        <span class="name">${loc.name}</span>
                        <span class="badge">${isDiscovered ? '✅' : '🔒'}</span>
                    </div>
                `;
            }).join('');
        }

       
        window.openLocation = function(locationId) {
            window.location.href = `map.html?location=${locationId}`;
        };

       
        window.exportSave = function() {
            const state = getState();
            const data = {
                user: state.user,
                discoveries: state.user?.discoveries || [],
                xp: getTotalXP(),
                level: getLevel(),
                exportedAt: new Date().toISOString()
            };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `lostuet_save_${new Date().toISOString().split('T')[0]}.json`;
            a.click();
            URL.revokeObjectURL(url);
        };

        window.importSave = function(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    alert('✅ Save imported successfully!');
                    console.log('Imported data:', data);
                } catch (error) {
                    alert('❌ Invalid save file!');
                }
            };
            reader.readAsText(file);
        };

        setInterval(async () => {
            console.log('🔄 Auto-refreshing discoveries...');
            await refreshUserData();
            await refreshLocations();
        }, 10000);

        
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', loadData);
        } else {
            loadData();
        }
    </script>
</body>
</html>
